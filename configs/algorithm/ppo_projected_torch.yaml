algorithm:
  name: ppo_projected
  backend: torch
  action_interface: projected_continuous_to_discrete
  action_dimension: 3
device:
  type: auto
  amp: true
  deterministic: false
  allow_tf32: true
vector_env:
  num_envs: 8
  backend: subprocess
  start_method: spawn
model:
  hidden_sizes: [256, 256]
ppo:
  rollout_steps: 256
  update_epochs: 10
  minibatch_size: 512
  gamma: 0.99
  gae_lambda: 0.95
  learning_rate: 0.0003
  clip_range: 0.2
  vf_coef: 0.5
  ent_coef: 0.0
  max_grad_norm: 0.5
  target_kl: 0.03
  bootstrap_truncated: true
projection:
  metric: weighted_normalized_command_distance
  weights: {nx: 1.0, nf: 1.0, gamma_s: 1.0}
  ranges: {nx: 18.0, nf: 9.0, gamma_s: 3.141592653589793}
